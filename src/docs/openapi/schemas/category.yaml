Category:
  type: object
  required:
    - id
    - name
    - slug
    - created_at
    - updated_at

  properties:
    id:
      type: string
      format: uuid
      example: 5592ac3e-b03d-4dc2-a82a-29a370c62d94

    name:
      type: string
      example: شبکه اجتماعی

    description:
      type: string
      nullable: true
      example: در این دسته بندی درباره شبکه های اجتماعی مقاله منتشر میشود

    slug:
      type: string
      example: شبکه-اجتماعی

    created_at:
      type: string
      format: date-time
      example: 2026-09-07T09:40:46.580Z

    updated_at:
      type: string
      format: date-time
      example: 2026-09-07T09:40:46.580Z
