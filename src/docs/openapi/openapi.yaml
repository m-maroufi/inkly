openapi: 3.0.3

info:
  title: Inkly API
  description: REST API for Inkly blogging platform
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

tags:
  - name: Health
    description: API health checks

  - name: Categories
    description: Blog category management

  - name: Auth
    description: Authentication and account access endpoints.
paths:
  /categories:
    $ref: "./paths/categories.yaml#/categories"

  /categories/id/{id}:
    $ref: "./paths/categories.yaml#/categoryById"

  /categories/{slug}:
    $ref: "./paths/categories.yaml#/categoryBySlug"

  /auth/email/register:
    $ref: "./paths/auth.yaml#/authEmailRegister"

components:
  schemas:
    Category:
      $ref: "./schemas/category.yaml#/Category"

    ErrorResponse:
      $ref: "./schemas/error.yaml#/ErrorResponse"
