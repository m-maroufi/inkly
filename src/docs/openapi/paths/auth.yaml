authEmailRegister:
  post:
    tags:
      - Auth
    summary: Register with email
    description: Creates a new user account using email and password.
    operationId: registerWithEmail
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/EmailRegisterRequest"
          example:
            email: test@example.com
            username: test_user
            displayName: Test User
            password: Test1234

    responses:
      "201":
        description: User registered successfully.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/EmailRegisterResponse"

      "400":
        description: Invalid request body.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

      "409":
        description: Email or username is already in use.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

      "500":
        description: Internal server error.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

authEmailVerify:
  post:
    tags:
      - Auth
    summary: Verify email address
    description: Verifies a user's email address using a valid verification token.
    operationId: verifyEmail
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/EmailVerifyRequest"
          example:
            token: "verification-token"

    responses:
      "200":
        description: Email verified successfully.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/EmailVerifyResponse"

      "400":
        description: Invalid request body.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

      "404":
        description: Verification token is invalid or expired.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

      "500":
        description: Internal server error.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

authEmailLogin:
  post:
    tags:
      - Auth
    summary: Login with email
    description: Authenticates a user using email and password.
    operationId: loginWithEmail

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/EmailLoginRequest"
          example:
            email: test@example.com
            password: Test1234

    responses:
      "200":
        description: Login successful.
        headers:
          Set-Cookie:
            description: HttpOnly refresh token cookie.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/EmailLoginResponse"

      "400":
        description: Invalid request body.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

      "401":
        description: Invalid credentials or unverified email.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

      "500":
        description: Internal server error.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

authForgotPassword:
  post:
    tags:
      - Auth
    summary: Request password reset
    description: Sends a password reset link if an account exists with the provided email address.
    operationId: forgotPassword

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/ForgotPasswordRequest"
          example:
            email: test@example.com

    responses:
      "200":
        description: Password reset request processed.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/ForgotPasswordResponse"

      "400":
        description: Invalid request body.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

      "500":
        description: Internal server error.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

authResetPassword:
  post:
    tags:
      - Auth
    summary: Reset password
    description: Resets the user's password using a valid password reset token.
    operationId: resetPassword

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/ResetPasswordRequest"
          example:
            token: reset-token
            password: NewPassword123

    responses:
      "200":
        description: Password reset successfully.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/ResetPasswordResponse"

      "400":
        description: Invalid request body.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

      "404":
        description: Invalid or expired password reset token.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

      "500":
        description: Internal server error.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

authRefresh:
  post:
    tags:
      - Auth
    summary: Refresh access token
    description: Rotates the refresh token and returns a new access token.
    operationId: refreshToken

    responses:
      "200":
        description: Access token refreshed successfully.
        headers:
          Set-Cookie:
            description: Rotated HttpOnly refresh token cookie.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/RefreshTokenResponse"

      "401":
        description: Missing, invalid, expired, or revoked refresh token.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

      "500":
        description: Internal server error.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

authLogout:
  post:
    tags:
      - Auth
    summary: Logout
    description: Revokes the current refresh token and clears the refresh token cookie.
    operationId: logout

    responses:
      "204":
        description: Logout successful.

      "500":
        description: Internal server error.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

authMe:
  get:
    tags:
      - Auth
    summary: Get current user
    description: Returns the currently authenticated user's public information.
    operationId: getCurrentUser

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Current user retrieved successfully.
        content:
          application/json:
            schema:
              $ref: "../schemas/user.yaml#/PublicUserResponse"

      "401":
        description: Authentication required or access token is invalid.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

      "404":
        description: User not found.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"

      "500":
        description: Internal server error.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/ErrorResponse"
