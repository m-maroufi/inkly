openapi: 3.0.3

info:
  title: Inkly API
  description: REST API for Inkly blogging platform
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

tags:
  - name: Health
    description: API health checks

  - name: Categories
    description: Blog category management

paths:
  /categories:
    post:
      tags:
        - Categories
      summary: Create a new category
      description: Creates a new blog category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: شبکه اجتماعی
                description:
                  type: string
                  maxLength: 500
                  example: در این دسته بندی درباره شبکه های اجتماعی مقاله منتشر میشود

      responses:
        "201":
          description: Category created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Category"

        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  statusCode: 400
                  message: Validation failed
                  details:
                    - origin: string
                      code: too_small
                      minimum: 2
                      inclusive: true
                      path:
                        - name
                      message: Category name is required.

        "409":
          description: Category with this slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  statusCode: 409
                  message: Category with this slug already exists.

    get:
      tags:
        - Categories
      summary: Get all categories
      description: Returns a list of all blog categories.
      responses:
        "200":
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"

  /categories/id/{id}:
    get:
      tags:
        - Categories
      summary: Get category by ID
      description: Returns a single blog category by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Category UUID
          schema:
            type: string
            format: uuid
          example: 5592ac3e-b03d-4dc2-a82a-29a370c62d94

      responses:
        "200":
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Category"

        "400":
          description: Invalid category ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  statusCode: 400
                  message: Validation failed

        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  statusCode: 404
                  message: Category not found

    patch:
      tags:
        - Categories
      summary: Update category
      description: >
        Updates an existing blog category. At least one of name or description
        must be provided. The category slug is not changed when the name is updated.
      parameters:
        - name: id
          in: path
          required: true
          description: Category UUID
          schema:
            type: string
            format: uuid
          example: 5592ac3e-b03d-4dc2-a82a-29a370c62d94

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: شبکه و اینترنت
                description:
                  type: string
                  maxLength: 500
                  example: مقالات مربوط به شبکه، اینترنت و فناوری‌های مرتبط

      responses:
        "200":
          description: Category updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Category"

        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidName:
                  summary: Invalid category name
                  value:
                    success: false
                    error:
                      statusCode: 400
                      message: Validation failed
                      details:
                        - origin: string
                          code: too_small
                          minimum: 1
                          inclusive: true
                          path:
                            - name
                          message: Category name is required.

                emptyBody:
                  summary: Empty update body
                  value:
                    success: false
                    error:
                      statusCode: 400
                      message: Validation failed
                      details:
                        - code: custom
                          path: []
                          message: At least one field must be provided for update.

        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  statusCode: 404
                  message: Category not found

    delete:
      tags:
        - Categories
      summary: Delete category
      description: >
        Deletes an existing blog category. A category cannot be deleted
        if it is still being used by one or more posts.
      parameters:
        - name: id
          in: path
          required: true
          description: Category UUID
          schema:
            type: string
            format: uuid
          example: 5592ac3e-b03d-4dc2-a82a-29a370c62d94

      responses:
        "200":
          description: Category deleted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Category"

        "400":
          description: Invalid category ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  statusCode: 400
                  message: Validation failed

        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  statusCode: 404
                  message: Category not found

        "409":
          description: Category cannot be deleted because it is still being used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  statusCode: 409
                  message: Resource cannot be deleted because it is still being used.
  /categories/{slug}:
    get:
      tags:
        - Categories
      summary: Get category by slug
      description: Returns a single blog category by its slug.
      parameters:
        - name: slug
          in: path
          required: true
          description: Category slug
          schema:
            type: string
          example: شبکه-اجتماعی

      responses:
        "200":
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Category"

        "400":
          description: Invalid category slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  statusCode: 400
                  message: Validation failed
                  details:
                    - code: too_small
                      minimum: 1
                      inclusive: true
                      path:
                        - slug
                      message: Slug is required

        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  statusCode: 404
                  message: Category not found

components:
  schemas:
    Category:
      type: object
      required:
        - id
        - name
        - slug
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 5592ac3e-b03d-4dc2-a82a-29a370c62d94

        name:
          type: string
          example: شبکه اجتماعی

        description:
          type: string
          nullable: true
          example: در این دسته بندی درباره شبکه های اجتماعی مقاله منتشر میشود

        slug:
          type: string
          example: شبکه-اجتماعی

        created_at:
          type: string
          format: date-time
          example: 2026-09-07T09:40:46.580Z

        updated_at:
          type: string
          format: date-time
          example: 2026-09-07T09:40:46.580Z

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false

        error:
          type: object
          required:
            - statusCode
            - message
          properties:
            statusCode:
              type: integer
              example: 409

            message:
              type: string
              example: Category with this slug already exists.

            details:
              type: array
              description: Validation error details. Present only when validation fails.
              items:
                type: object
