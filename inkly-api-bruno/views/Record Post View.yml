info:
  name: Record Post View
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/views/post/{{postId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: postId
      value: b7741389-61fc-4b86-89be-b82e7e32a28c

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## ثبت بازدید مقاله (Record Post View)

  این اندپوینت برای ثبت بازدید جدید روی یک مقاله منتشر شده توسط بازدیدکنندگان (اعم از کاربران عضو یا مهمانان ناشناس) استفاده می‌شود.

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **سیستم ضداسپم هوشمند (Redis Debounce):**
    - برای هر کاربر لاگین کرده (بر اساس `userId`) یا مهمان ناشناس (بر اساس `IP`) یک کول‌داون ۱ ساعته در Redis اعمال می‌شود.
    - اگر کاربر در کمتر از ۱ ساعت اخیر مجدداً صفحه را رفرش کند، بازدید جدیدی در دیتابیس ثبت نمی‌شود (`recorded: false`) تا از دستکاری آمار جلوگیری شود.
    - در اولین بازدید، رکورد در جدول `post_views` ثبت شده و `recorded: true` بازگردانده می‌شود.
  - **وضعیت مقاله:** فقط مقالاتی که در وضعیت `PUBLISHED` هستند امکان ثبت بازدید دارند (برای سایر وضعیت‌ها خطای `404 Not Found`).
  - **اطلاعات ذخیره‌شده:** آدرس IP، مشخصات مرورگر/دستگاه (`userAgent`)، شناسه کاربر (در صورت لاگین بودن) و زمان دقیق بازدید.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع دسترسی:** عمومی اختیاری (Public / Optional Auth - هم با توکن و هم بدون توکن کار می‌کند)

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `POST`
  - **آدرس:** `{{base_url}}/views/post/:postId`
  - **بدنه:** ندارد

  ---

  ### 📤 نمونه پاسخ موفق (`200 OK`)

  #### در اولین بازدید (ثبت موفق):
  ```json
  {
    "success": true,
    "data": {
      "recorded": true,
      "totalViews": 1
    }
  }
  ```

  #### در رفرش مجدد (شناسایی توسط ریدیس به عنوان بازدید تکراری):
  ```json
  {
    "success": true,
    "data": {
      "recorded": false,
      "totalViews": 1
    }
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `400 Bad Request` | فرمت `postId` در URL معتبر نیست (UUID نیست) |
  | `404 Not Found` | مقاله با این شناسه یافت نشد یا منتشر نشده است |
