docs: |-
  ## دریافت لیست دنبال‌کنندگان کاربر (Get User Followers)

  این اندپوینت عمومی برای دریافت تعداد کل و مشخصات کاربرانی که یک نویسنده را دنبال (فالو) کرده‌اند استفاده می‌شود.

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **بررسی وجود کاربر:** کاربر هدف باید حتماً در سیستم وجود داشته باشد (در غیر این صورت خطای `404 Not Found`).
  - **اطلاعات کاربران:** برای هر دنبال‌کننده فیلدهای عمومی (`id`, `username`, `displayName`, `avatarUrl`, `bio`) به همراه تاریخ شروع دنبال کردن (`followedAt`) بازگردانده می‌شود.
  - **ترتیب نمایش:** کاربران بر اساس زمان شروع دنبال کردن به صورت نزولی (جدیدترین دنبال‌کنندگان در ابتدا) مرتب هستند.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع دسترسی:** عمومی (Public - بدون نیاز به توکن احراز هویت)

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `GET`
  - **آدرس:** `{{base_url}}/follows/:userId/followers`
  - **بدنه:** ندارد

  ---

  ### 📤 نمونه پاسخ موفق (`200 OK`)
  ```json
  {
    "success": true,
    "data": {
      "followersCount": 1,
      "followers": [
        {
          "id": "u1111111-1111-1111-1111-111111111111",
          "username": "mehdi",
          "displayName": "مهدی",
          "avatarUrl": null,
          "bio": "توسعه‌دهنده فول‌استک",
          "followedAt": "2026-10-30T09:56:00.000Z"
        }
      ]
    }
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `400 Bad Request` | فرمت `userId` در URL نامعتبر است (UUID نیست) |
  | `404 Not Found` | کاربر با این شناسه یافت نشد |
