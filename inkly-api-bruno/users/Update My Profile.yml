info:
  name: Update My Profile
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{base_url}}/users/me"
  body:
    type: multipart-form
    data:
      - name: avatar
        type: file
        value:
          - /home/mehti/Downloads/Cozy Creator Workspace Avatar.png
        contentType: image/png
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## ویرایش پروفایل من (Update My Profile)

  این اندپوینت برای به‌روزرسانی اطلاعات حساب کاربری (نام نمایشی، بیوگرافی، نام کاربری) و آپلود اختیاری تصویر آواتار در Cloudinary استفاده می‌شود.

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **یکتا بودن نام کاربری:** اگر کاربر نام کاربری (`username`) جدیدی انتخاب کند، نباید قبلاً توسط کاربر دیگری ثبت شده باشد (در غیر این صورت خطای `409 Conflict`).
  - **اعتبارسنجی فرمت:**
    - `displayName`: بین ۲ تا ۵۰ کاراکتر.
    - `bio`: حداکثر ۵۰۰ کاراکتر.
    - `username`: بین ۳ تا ۳۰ کاراکتر و تنها شامل حروف انگلیسی، اعداد و خط زیر (`_`).
  - **آپلود تصویر آواتار (اختیاری):**
    - فیلد فایل باید با کلید `avatar` ارسال شود.
    - فرمت‌های مجاز: `image/jpeg`, `image/png`, `image/webp`.
    - حداکثر حجم فایل: ۵ مگابایت.
    - تصویر به صورت خودکار روی Cloudinary در پوشه `inkly/avatars` ذخیره شده و لینک امن آن در دیتابیس ثبت می‌شود.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع توکن:** Bearer Token (`{{accessToken}}`)
  - **نقش‌های مجاز:** تمام کاربران لاگین کرده (`USER`, `AUTHOR`, `ADMIN`)

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `PATCH`
  - **آدرس:** `{{base_url}}/users/me`
  - **نوع بدنه:** `JSON` یا `Multipart Form`

  #### نمونه بدنه درخواست (JSON):
  ```json
  {
    "displayName": "مهدی معروفی",
    "bio": "توسعه‌دهنده بک‌اند Node.js و علاقه‌مند به معماری سیستم‌های توزیع‌شده",
    "username": "mehdi_backend"
  }
  ```

  ---

  ### 📤 نمونه پاسخ موفق (`200 OK`)
  ```json
  {
    "success": true,
    "data": {
      "id": "36c5b3f9-da2b-4577-afe2-0ba225b98049",
      "email": "mahdimaroufi.it@gmail.com",
      "username": "mehdi_backend",
      "display_name": "مهدی معروفی",
      "avatar_url": "https://res.cloudinary.com/demo/image/upload/sample.jpg",
      "bio": "توسعه‌دهنده بک‌اند Node.js و علاقه‌مند به معماری سیستم‌های توزیع‌شده",
      "role": "ADMIN",
      "email_verified_at": "2026-10-15T08:00:00.000Z",
      "phone_verified_at": null,
      "created_at": "2026-10-15T08:00:00.000Z",
      "updated_at": "2026-10-30T12:28:00.000Z"
    }
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `400 Bad Request` | فرمت فیلدها نامعتبر است یا فرمت/حجم فایل عکس مجاز نیست |
  | `401 Unauthorized` | کاربر لاگین نکرده است یا توکن منقضی است |
  | `409 Conflict` | نام کاربری انتخابی قبلاً توسط کاربر دیگری ثبت شده است |
