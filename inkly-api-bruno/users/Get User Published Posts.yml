info:
  name: Get User Published Posts
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/users/{{username}}/posts"
  auth: inherit

runtime:
  variables:
    - name: username
      value: mehdi_dev

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## دریافت مقالات منتشر شده نویسنده (Get User Published Posts)

  این اندپوینت عمومی برای دریافت لیست تمامی مقالاتی که توسط یک نویسنده خاص منتشر شده‌اند (`status: PUBLISHED`) استفاده می‌شود.

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **فیلتر وضعیت انتشار:** تنها پست‌هایی که در وضعیت `PUBLISHED` قرار دارند نمایش داده می‌شوند (پست‌های پیش‌نویس، در انتظار یا رد شده به هیچ وجه نمایش داده نمی‌شوند).
  - **اطلاعات دسته‌بندی:** برای هر مقاله، نام و اسلاگ دسته‌بندی مربوطه جوین شده و بازگردانده می‌شود.
  - **ترتیب نمایش:** مقالات بر اساس تاریخ انتشار (`publishedAt`) به صورت نزولی (جدیدترین مقالات در بالا) مرتب شده‌اند.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع دسترسی:** عمومی (Public - بدون نیاز به توکن احراز هویت)

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `GET`
  - **آدرس:** `{{base_url}}/users/:username/posts`
  - **بدنه:** ندارد

  ---

  ### 📤 نمونه پاسخ موفق (`200 OK`)
  ```json
  {
    "success": true,
    "data": [
      {
        "id": "p1111111-1111-1111-1111-111111111111",
        "title": "معماری تمیز در نود جی‌اس",
        "slug": "clean-architecture-in-nodejs",
        "excerpt": "راهنمای عملی پیاده‌سازی معماری تمیز و لایه‌ای در اکسپرس...",
        "coverImageUrl": "https://res.cloudinary.com/demo/image/upload/sample.jpg",
        "publishedAt": "2026-10-25T14:00:00.000Z",
        "createdAt": "2026-10-20T10:00:00.000Z",
        "category": {
          "id": "c1111111-1111-1111-1111-111111111111",
          "name": "برنامه‌نویسی",
          "slug": "programming"
        }
      }
    ]
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `400 Bad Request` | نام کاربری نامعتبر است |
  | `404 Not Found` | نویسنده با این نام کاربری یافت نشد |
