info:
  name: Mark Notification As Read
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url}}/notifications/{{notificationId}}/read"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: notificationId
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## علامت‌گذاری تکی یک اعلان به عنوان خوانده‌شده (Mark Notification As Read)

  این اندپوینت برای خوانده‌شده کردن یک اعلان مشخص توسط کاربر لاگین کرده استفاده می‌شود (وقتی کاربر روی یک اعلان در لیست کلیک می‌کند).

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **بررسی وجود اعلان:** اعلان باید در سیستم موجود باشد (در غیر این صورت خطای `404 Not Found`).
  - **بررسی مالکیت (امنیت):** هر کاربر فقط و فقط می‌تواند اعلان‌های اختصاصی خود را به عنوان خوانده‌شده علامت‌گذاری کند؛ در صورت تلاش برای دسترسی به اعلان کاربری دیگر خطای `403 Forbidden` بازگردانده می‌شود.
  - **به‌روزرسانی تاریخ:** زمان `read_at` به تاریخ و زمان جاری سرور تنظیم می‌شود.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع توکن:** Bearer Token (`{{accessToken}}`)
  - **نقش‌های مجاز:** گیرنده خودِ اعلان

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `PATCH`
  - **آدرس:** `{{base_url}}/notifications/:notificationId/read`
  - **بدنه:** ندارد

  ---

  ### 📤 نمونه پاسخ موفق (`200 OK`)
  ```json
  {
    "success": true,
    "data": {
      "id": "n1111111-1111-1111-1111-111111111111",
      "readAt": "2026-11-03T17:15:00.000Z"
    }
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `400 Bad Request` | فرمت `notificationId` نامعتبر است (UUID نیست) |
  | `401 Unauthorized` | کاربر لاگین نکرده است یا توکن منقضی است |
  | `403 Forbidden` | کاربر مالک این اعلان نیست |
  | `404 Not Found` | اعلان با این شناسه یافت نشد |
