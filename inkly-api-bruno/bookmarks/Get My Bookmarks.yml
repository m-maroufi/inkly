info:
  name: Get My Bookmarks
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/bookmarks/me"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## دریافت لیست پست‌های نشان‌شده من (Get My Bookmarks)

  این اندپوینت برای دریافت لیست کامل مقالاتی که توسط خودِ کاربر لاگین کرده نشان (ذخیره) شده‌اند استفاده می‌شود (صفحه پست‌های ذخیره‌شده کاربر).

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **حریم خصوصی (Privacy):** بوکمارک‌ها کاملاً شخصی هستند و هر کاربر فقط و فقط می‌تواند لیست پست‌های ذخیره‌شده‌ی خود را مشاهده کند.
  - **فیلتر وضعیت پست:** تنها پست‌هایی که در وضعیت `PUBLISHED` قرار دارند در خروجی ظاهر می‌شوند.
  - **اطلاعات غنی (Rich Post Data):** برای هر پست ذخیره‌شده، اطلاعات کامل شامل عنوان، اسلاگ، چکیده، تصویر کاور، تاریخ انتشار، تاریخ ذخیره شدن (`bookmarkedAt`)، اطلاعات نویسنده و دسته‌بندی پست بازگردانده می‌شود.
  - **ترتیب نمایش:** مقالات بر اساس تاریخ ذخیره شدن به صورت نزولی (جدیدترین بوکمارک‌ها در بالا) مرتب شده‌اند.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع توکن:** Bearer Token (`{{accessToken}}`)
  - **نقش‌های مجاز:** تمام کاربران لاگین کرده (`USER`, `AUTHOR`, `ADMIN`)

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `GET`
  - **آدرس:** `{{base_url}}/bookmarks/me`
  - **بدنه:** ندارد

  ---

  ### 📤 نمونه پاسخ موفق (`200 OK`)
  ```json
  {
    "success": true,
    "data": [
      {
        "id": "p1111111-1111-1111-1111-111111111111",
        "title": "راهنمای جامع معماری میکروسرویس",
        "slug": "comprehensive-guide-to-microservices",
        "excerpt": "در این مقاله به بررسی عمیق الگوهای معماری توزیع‌شده می‌پردازیم...",
        "coverImageUrl": "https://res.cloudinary.com/demo/image/upload/sample.jpg",
        "publishedAt": "2026-10-20T14:30:00.000Z",
        "bookmarkedAt": "2026-10-25T21:08:00.000Z",
        "author": {
          "id": "u1111111-1111-1111-1111-111111111111",
          "username": "ali",
          "displayName": "علی رضایی",
          "avatarUrl": null
        },
        "category": {
          "id": "c1111111-1111-1111-1111-111111111111",
          "name": "مهندسی نرم‌افزار",
          "slug": "software-engineering"
        }
      }
    ]
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `401 Unauthorized` | کاربر لاگین نکرده است یا توکن نامعتبر/منقضی است |
