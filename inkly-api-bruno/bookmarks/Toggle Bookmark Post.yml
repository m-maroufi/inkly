info:
  name: Toggle Bookmark Post
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/bookmarks/post/{{postId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: postId
      value: b7741389-61fc-4b86-89be-b82e7e32a28c

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## نشان کردن یا حذف از نشان‌ها (Toggle Bookmark)

  این اندپوینت برای ذخیره کردن (Bookmark) یا حذف یک پست از لیست نشان‌شده‌های کاربر لاگین کرده استفاده می‌شود.

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **عملکرد دوطرفه (Toggle):**
    - اگر پست قبلاً نشان **نشده باشد**: رکورد بوکمارک ایجاد شده و `{ "bookmarked": true }` بازگردانده می‌شود.
    - اگر پست قبلاً نشان **شده باشد**: رکورد بوکمارک حذف شده و `{ "bookmarked": false }` بازگردانده می‌شود.
  - **وضعیت پست:** تنها پست‌هایی با وضعیت `PUBLISHED` قابلیت نشان شدن دارند (در غیر این صورت خطای `404 Not Found`).
  - **کلید ترکیبی:** در سطح دیتابیس ترکیب `(user_id, post_id)` یکتاست و امکان ذخیره تکراری یک پست وجود ندارد.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع توکن:** Bearer Token (`{{accessToken}}`)
  - **نقش‌های مجاز:** تمام کاربران لاگین کرده (`USER`, `AUTHOR`, `ADMIN`)

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `POST`
  - **آدرس:** `{{base_url}}/bookmarks/post/:postId`
  - **بدنه:** ندارد

  ---

  ### 📤 نمونه پاسخ موفق (`200 OK`)

  #### در صورت نشان کردن:
  ```json
  {
    "success": true,
    "data": {
      "bookmarked": true
    }
  }
  ```

  #### در صورت حذف از نشان‌ها:
  ```json
  {
    "success": true,
    "data": {
      "bookmarked": false
    }
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `400 Bad Request` | فرمت شناسه `postId` در URL نامعتبر است (UUID نیست) |
  | `401 Unauthorized` | کاربر لاگین نکرده است یا توکن نامعتبر است |
  | `404 Not Found` | پست یافت نشد یا در وضعیت منتشر شده قرار ندارد |
