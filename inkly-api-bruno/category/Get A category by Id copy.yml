info:
  name: Get A category by Id copy
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/categories/{{slug}}"
  auth: inherit

runtime:
  variables:
    - name: slug
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
