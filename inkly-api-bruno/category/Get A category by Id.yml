info:
  name: Get A category by Id
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/categories/{{id}}"
  auth: inherit

runtime:
  variables:
    - name: id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
