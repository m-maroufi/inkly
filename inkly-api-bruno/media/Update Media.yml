info:
  name: Update Media
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url}}/media/{{mediaId}}"
  body:
    type: json
    data: |-
      {
        "altText": "متن جایگزین به‌روزرسانی شده برای سئو و دسترس‌پذیری"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: mediaId
      value: 9f8416e5-56b1-4e81-b6df-b33c67515f6e

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## ویرایش مشخصات رسانه (Update Media)

  این اندپوینت برای ویرایش و به‌روزرسانی متن جایگزین (`altText`) یک فایل رسانه‌ای به منظور بهبود دسترس‌پذیری و سئو توسط مالک فایل یا مدیر سیستم استفاده می‌شود.

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **احراز هویت و مالکیت:** فقط کاربر آپلودکننده فایل (`uploaded_by = current_user`) یا کاربران با نقش `ADMIN` اجازه ویرایش دارند (سایر کاربران خطای `403 Forbidden` دریافت می‌کنند).
  - **بررسی وجود فایل:** در صورتی که فایلی با این شناسه یافت نشود، خطای `404 Not Found` صادر می‌شود.
  - **اعتبارسنجی فیلد `altText`:** این فیلد اجباری است، نباید خالی باشد و حداکثر طول مجاز آن ۲۵۵ کاراکتر است.
  - **به‌روزرسانی تاریخ:** فیلد `updated_at` در پایگاه داده به صورت خودکار به زمان ویرایش تغییر می‌یابد.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع دسترسی:** نیاز به لاگین (Bearer Token: `{{accessToken}}`)
  - **نقش‌های مجاز:** مالک فایل یا `ADMIN`

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `PATCH`
  - **آدرس:** `{{base_url}}/media/:mediaId`
  - **پارامتر مسیر (`Params`):** `mediaId` = شناسه UUID فایل رسانه
  - **هدرها:** `Content-Type: application/json`
  - **بدنه نمونه:**
  ```json
  {
    "altText": "متن جایگزین به‌روزرسانی شده برای سئو و دسترس‌پذیری"
  }
  ```

  ---

  ### 📤 نمونه پاسخ موفق (`200 OK`)
  ```json
  {
    "success": true,
    "message": "Media updated successfully.",
    "data": {
      "id": "e8d6fcb2-6019-482f-870a-019fefba7412",
      "uploaded_by": "u1111111-1111-1111-1111-111111111111",
      "original_name": "cover-image.png",
      "storage_key": "inkly/media/abc123xyz",
      "url": "http://res.cloudinary.com/demo/image/upload/v1234567890/inkly/media/abc123xyz.png",
      "media_type": "IMAGE",
      "mime_type": "image/png",
      "size": 245890,
      "width": null,
      "height": null,
      "alt_text": "متن جایگزین به‌روزرسانی شده برای سئو و دسترس‌پذیری",
      "created_at": "2026-11-06T10:50:00.000Z",
      "updated_at": "2026-11-06T11:05:00.000Z"
    }
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `400 Bad Request` | فرمت `mediaId` نامعتبر است یا فیلد `altText` خالی / بیش از ۲۵۵ کاراکتر است |
  | `401 Unauthorized` | کاربر لاگین نکرده است یا توکن ارسال نشده است |
  | `403 Forbidden` | کاربر مالک این فایل نیست و نقش ادمین نیز ندارد |
  | `404 Not Found` | فایلی با این شناسه در سامانه یافت نشد |
