info:
  name: Get My Media
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/media"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## دریافت کتابخانه رسانه‌های کاربر (Get My Media)

  این اندپوینت برای دریافت لیست تمامی تصاویر و رسانه‌هایی که کاربر جاری تا کنون در سامانه آپلود کرده است (Media Library) استفاده می‌شود.

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **حریم خصوصی و دسترسی:** هر کاربر منحصراً رسانه‌های آپلود شده توسط خودش را مشاهده می‌کند (`uploaded_by = current_user`).
  - **ترتیب نمایش:** رسانه‌ها بر اساس تاریخ ایجاد (`createdAt`) به صورت نزولی (جدیدترین فایل‌ها در بالا) مرتب شده‌اند.
  - **اطلاعات کامل متادیتا:** مشخصاتی مانند آدرس دسترسی عمومی (`url`)، نام فایل اصلی، حجم، نوع فایل و متن جایگزین بازگردانده می‌شوند.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع دسترسی:** نیاز به لاگین (Bearer Token: `{{accessToken}}`)
  - **نقش‌های مجاز:** تمام کاربران لاگین‌کرده (`USER`, `AUTHOR`, `ADMIN`)

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `GET`
  - **آدرس:** `{{base_url}}/media`
  - **بدنه:** ندارد

  ---

  ### 📤 نمونه پاسخ موفق (`200 OK`)
  ```json
  {
    "success": true,
    "data": [
      {
        "id": "e8d6fcb2-6019-482f-870a-019fefba7412",
        "uploaded_by": "u1111111-1111-1111-1111-111111111111",
        "original_name": "cover-image.png",
        "storage_key": "inkly/media/abc123xyz",
        "url": "http://res.cloudinary.com/demo/image/upload/v1234567890/inkly/media/abc123xyz.png",
        "media_type": "IMAGE",
        "mime_type": "image/png",
        "size": 245890,
        "width": null,
        "height": null,
        "alt_text": "تصویر کاور مقاله آموزش نود جی‌اس",
        "created_at": "2026-11-06T10:50:00.000Z",
        "updated_at": "2026-11-06T10:50:00.000Z"
      }
    ]
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `401 Unauthorized` | کاربر لاگین نکرده است یا توکن ارسال نشده است |
