info:
  name: Upload Media
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/media"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - /home/mehti/Downloads/download.jpeg
        contentType: image/jpeg
      - name: altText
        type: text
        value: تصویر کاور مقاله آموزش نود جی‌اس
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## آپلود رسانه جدید (Upload Media)

  این اندپوینت برای دریافت فایل تصویری از کاربر، آپلود امن آن بر روی سرورهای Cloudinary و ثبت مشخصات و متادیتای آن در پایگاه داده استفاده می‌شود.

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **احراز هویت الزامی:** فقط کاربران لاگین‌کرده (`USER`, `AUTHOR`, `ADMIN`) می‌توانند رسانه آپلود کنند.
  - **محدودیت نوع فایل (MIME Type):** فقط فرمت‌های تصویری `image/jpeg`، `image/png` و `image/webp` مجاز هستند (سایر فرمت‌ها خطای `400 Bad Request` دریافت می‌کنند).
  - **محدودیت حجم فایل:** حداکثر حجم مجاز برای هر فایل **5 مگابایت** است.
  - **فیلد متن جایگزین (`altText`):** اختیاری بوده و حداکثر می‌تواند ۲۵۵ کاراکتر باشد.
  - **ذخیره‌سازی ابری:** تصویر در سرور ابری Cloudinary و در پوشه اختصاصی `inkly/media` آپلود شده و کلید ذخیره‌سازی (`storage_key`) و آدرس دسترسی عمومی (`url`) آن در جدول `media` ذخیره می‌گردد.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع دسترسی:** نیاز به لاگین (Bearer Token: `{{accessToken}}`)
  - **نقش‌های مجاز:** تمام کاربران لاگین‌کرده (`USER`, `AUTHOR`, `ADMIN`)

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `POST`
  - **آدرس:** `{{base_url}}/media`
  - **نوع بدنه (Content-Type):** `multipart/form-data`
  - **فیلدهای فرم:**
    - `file`: فایل تصویر انتخابی (اجباری)
    - `altText`: متن جایگزین تصویر برای دسترس‌پذیری و سئو (اختیاری)

  ---

  ### 📤 نمونه پاسخ موفق (`201 Created`)
  ```json
  {
    "success": true,
    "message": "Media uploaded successfully.",
    "data": {
      "id": "e8d6fcb2-6019-482f-870a-019fefba7412",
      "uploaded_by": "u1111111-1111-1111-1111-111111111111",
      "original_name": "cover-image.png",
      "storage_key": "inkly/media/abc123xyz",
      "url": "http://res.cloudinary.com/demo/image/upload/v1234567890/inkly/media/abc123xyz.png",
      "media_type": "IMAGE",
      "mime_type": "image/png",
      "size": 245890,
      "width": null,
      "height": null,
      "alt_text": "تصویر کاور مقاله آموزش نود جی‌اس",
      "created_at": "2026-11-06T10:50:00.000Z",
      "updated_at": "2026-11-06T10:50:00.000Z"
    }
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `400 Bad Request` | عدم ارسال فایل، فرمت فایل غیرمجاز (فقط JPEG/PNG/WebP)، یا حجم بیش از ۵ مگابایت |
  | `401 Unauthorized` | کاربر لاگین نکرده است یا توکن ارسال نشده است |
  | `500 Internal Server` | خطای برقراری ارتباط با سرویس Cloudinary یا خطای پایگاه داده |
