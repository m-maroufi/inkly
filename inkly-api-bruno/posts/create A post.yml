info:
  name: create A post
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/posts"
  body:
    type: multipart-form
    data:
      - name: title
        type: text
        value: "ساخت فضای کاری برای برنامه نویسی "
      - name: excerpt
        type: text
        value: با چند تغییر ساده، فضایی آرام، کاربردی و الهام‌بخش برای تمرکز و خلاقیت بسازید.
      - name: categoryId
        type: text
        value: 6d4dad86-252e-4e63-aab0-0dd7cd2155e9
      - name: content
        type: text
        value: |-
          ## مقدمه

          فضای اطراف ما تأثیر زیادی بر تمرکز و کیفیت کار دارد. یک میز شلوغ می‌تواند ذهن را خسته کند، در حالی که محیطی ساده و منظم به ما کمک می‌کند بهتر فکر کنیم.

          ## ۱. فقط وسایل ضروری را نگه دارید

          لپ‌تاپ، دفتر یادداشت و چند وسیله ضروری برای شروع کافی هستند. وسایلی را که مرتب استفاده نمی‌کنید، از روی میز بردارید.

          ## ۲. به نورپردازی توجه کنید

          اگر امکانش را دارید، میز خود را نزدیک پنجره قرار دهید تا از نور طبیعی استفاده کنید. یک چراغ رومیزی مناسب هم برای ساعات تاریک روز مفید است.

          ## ۳. رنگ‌های ساده انتخاب کنید

          رنگ‌های خنثی مانند سفید، کرم و خاکستری روشن می‌توانند ظاهر محیط را آرام‌تر کنند. برای جلوگیری از یکنواختی، از یک گیاه کوچک یا وسیله‌ای با رنگ ملایم کمک بگیرید.

          ## ۴. نظم را به یک عادت تبدیل کنید

          در پایان هر روز چند دقیقه وقت بگذارید و میز را مرتب کنید. این کار باعث می‌شود روز بعد را با ذهنی آماده‌تر شروع کنید.

          ## جمع‌بندی

          برای داشتن یک فضای کاری مینیمال، لازم نیست همه‌چیز را عوض کنید. از حذف وسایل غیرضروری، نور مناسب و نظم روزانه شروع کنید و به‌تدریج محیطی متناسب با نیازهای خود بسازید.
      - name: seoTitle
        type: text
        value: ساخت فضای کاری مینیمال؛ راهنمای ساده برای تمرکز بیشتر
      - name: seoDescription
        type: text
        value: با راهکارهای ساده برای خلوت کردن میز، انتخاب نور مناسب و ساخت یک فضای کاری مینیمال، تمرکز و بهره‌وری خود را افزایش دهید.
      - name: coverImageAlt
        type: text
        value: میز کار مینیمال کنار پنجره با لپ‌تاپ، دفتر یادداشت و نور طبیعی
      - name: coverImage
        type: file
        value:
          - /home/mehti/Downloads/TuVtflS8k.jpg
        contentType: image/jpeg
      - name: tagIds
        type: text
        value: '["cab074f3-8785-4d84-aedc-67e15e6c0c99","128574d4-30b1-4d7f-ae67-eb749d8dc660"]'
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
