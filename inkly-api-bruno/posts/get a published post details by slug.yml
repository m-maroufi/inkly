info:
  name: get a published post details by slug
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/posts/{{slug}}"
  auth: inherit

runtime:
  variables:
    - name: slug
      value: چطور-یک-فضای-کاری-مینیمال-بسازیم

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
