info:
  name: Update Comment
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base_url}}/comments/{{commentId}}"
  body:
    type: json
    data: |-
      {
        "content": "این اولین کامنت اپدیت شده من روی این پست است!"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: commentId
      value: a333f2d8-8d84-4a8f-b95e-e4c445cfdbb6

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## ویرایش متن کامنت

  این اندپوینت برای ویرایش متن یک کامنت از قبل ثبت شده استفاده می‌شود.

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **مالکیت کامنت:** فقط و فقط نویسنده خودِ کامنت اجازه ویرایش متن آن را دارد؛ در صورتی که کاربر دیگری (حتی ادمین) درخواست دهد، خطای `403 Forbidden` بازگردانده می‌شود.
  - **طول متن:** متن کامنت حداقل ۱ و حداکثر ۲۰۰۰ کاراکتر است (فضاهای خالی ابتدا و انتها نادیده گرفته می‌شوند).
  - **به‌روزرسانی تاریخ:** زمان `updated_at` در دیتابیس به تاریخ و ساعت فعلی آپدیت می‌شود.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع توکن:** Bearer Token (`{{accessToken}}`)
  - **نقش‌های مجاز:** نویسنده خودِ کامنت

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `PATCH`
  - **آدرس:** `{{base_url}}/comments/:commentId`
  - **نوع بدنه:** `JSON`

  #### بدنه درخواست:
  ```json
  {
    "content": "متن ویرایش شده و نهایی کامنت"
  }
  ```

  ---

  ### 📤 نمونه پاسخ موفق (`200 OK`)
  ```json
  {
    "success": true,
    "data": {
      "id": "c1111111-1111-1111-1111-111111111111",
      "userId": "u1111111-1111-1111-1111-111111111111",
      "postId": "p1111111-1111-1111-1111-111111111111",
      "parentId": null,
      "content": "متن ویرایش شده و نهایی کامنت",
      "createdAt": "2026-10-23T10:00:00.000Z",
      "updatedAt": "2026-10-23T11:15:00.000Z",
      "author": {
        "id": "u1111111-1111-1111-1111-111111111111",
        "username": "mehdi",
        "displayName": "مهدی",
        "avatarUrl": null
      }
    }
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `400 Bad Request` | فرمت UUID یا طول متن نامعتبر است (متن خالی یا بیش از ۲۰۰۰ کاراکتر) |
  | `401 Unauthorized` | کاربر لاگین نکرده یا توکن نامعتبر/منقضی است |
  | `403 Forbidden` | کاربر نویسنده این کامنت نیست |
  | `404 Not Found` | کامنت با این شناسه یافت نشد |
