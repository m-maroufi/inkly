        "parentId": null,
        "content": "مقاله بسیار مفیدی بود، ممنون!",
        "createdAt": "2026-10-23T10:00:00.000Z",
        "updatedAt": "2026-10-23T10:00:00.000Z",
        "author": {
          "id": "u1111111-1111-1111-1111-111111111111",
