info:
  name: Get Post Comments
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/comments/post/{{postId}}"
  auth: inherit

runtime:
  variables:
    - name: postId
      value: 4e279a24-757b-4720-85fa-a54afcf75eeb

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## دریافت کامنت‌های یک پست

  این اندپوینت برای دریافت تمام کامنت‌های یک پست منتشر شده به صورت ساختار درختی (Threaded Comments) استفاده می‌شود.

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **وضعیت پست:** پست باید حتماً در وضعیت `PUBLISHED` باشد؛ در غیر این صورت خطای `404 Not Found` بازگردانده می‌شود.
  - **ساختار درختی:** کامنت‌های اصلی در ریشه آرایه قرار دارند و هر کامنت دارای یک آرایه `replies` شامل پاسخ‌های تودرتوی آن است.
  - **ترتیب نمایش:** کامنت‌ها بر اساس زمان ایجاد (`created_at`) به صورت صعودی (قدیم به جدید) مرتب هستند.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع دسترسی:** عمومی (بدون نیاز به توکن احراز هویت)

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `GET`
  - **آدرس:** `{{base_url}}/comments/post/:postId`

  ---

  ### 📤 نمونه پاسخ موفق (`200 OK`)
  ```json
  {
    "success": true,
    "data": [
      {
