info:
  name: Create Comment
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/comments/post/{{postId}}"
  body:
    type: json
    data: |-
      {
        "content": "این اولین کامنت تستی من روی این پست است!"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: postId
      value: 4e279a24-757b-4720-85fa-a54afcf75eeb

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## ایجاد کامنت یا پاسخ جدید (Reply)

  این اندپوینت برای ثبت یک کامنت اصلی یا پاسخ (Reply) به کامنت‌های دیگر روی یک پست منتشر شده استفاده می‌شود.

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **وضعیت پست:** ثبت کامنت تنها روی پست‌های با وضعیت `PUBLISHED` مجاز است (برای سایر وضعیت‌ها خطای `404 Not Found`).
  - **پاسخ به کامنت (Reply):** در صورتی که فیلد `parentId` ارسال شود:
    - کامنت والد باید وجود داشته باشد (`404 Not Found`).
    - کامنت والد باید حتماً متعلق به همین پست باشد؛ در غیر این صورت خطای `409 Conflict` بازگردانده می‌شود.
  - **طول متن:** متن کامنت حداقل ۱ و حداکثر ۲۰۰۰ کاراکتر است.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع توکن:** Bearer Token (`{{accessToken}}`)
  - **نقش‌های مجاز:** تمام کاربران لاگین کرده (`USER`, `AUTHOR`, `ADMIN`)

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `POST`
  - **آدرس:** `{{base_url}}/comments/post/:postId`
  - **نوع بدنه:** `JSON`

  #### بدنه درخواست نمونه (کامنت اصلی):
  ```json
  {
    "content": "مطلب بسیار عالی و آموزنده‌ای بود!"
  }
  ```

  #### بدنه درخواست نمونه (پاسخ به کامنت):
  ```json
  {
    "content": "من هم کاملاً با شما موافقم.",
    "parentId": "c1111111-1111-1111-1111-111111111111"
  }
  ```

  ---

  ### 📤 نمونه پاسخ موفق (`201 Created`)
  ```json
  {
    "success": true,
    "data": {
      "id": "c3333333-3333-3333-3333-333333333333",
      "userId": "u1111111-1111-1111-1111-111111111111",
      "postId": "p1111111-1111-1111-1111-111111111111",
      "parentId": null,
      "content": "مطلب بسیار عالی و آموزنده‌ای بود!",
      "createdAt": "2026-10-23T11:00:00.000Z",
      "updatedAt": "2026-10-23T11:00:00.000Z",
      "author": {
        "id": "u1111111-1111-1111-1111-111111111111",
        "username": "mehdi",
        "displayName": "مهدی",
        "avatarUrl": null
      }
    }
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `400 Bad Request` | فرمت UUID یا طول متن نامعتبر است (متن خالی یا بیش از ۲۰۰۰ کاراکتر) |
  | `401 Unauthorized` | کاربر لاگین نکرده یا توکن منقضی شده است |
  | `404 Not Found` | پست یا کامنت والد یافت نشد |
  | `409 Conflict` | کامنت والد به پستی دیگر تعلق دارد |
