info:
  name: Delete Comment
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{base_url}}/comments/{{commentId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: commentId
      value: a333f2d8-8d84-4a8f-b95e-e4c445cfdbb6

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## حذف کامنت

  این اندپوینت برای حذف یک کامنت و تمام پاسخ‌های زیرمجموعه آن (Cascade Delete) استفاده می‌شود.

  ---

  ### 📌 قوانین بیزینس لاجیک
  - **مجوزهای حذف (قانون سه‌گانه):** تنها ۳ گروه زیر اجازه حذف یک کامنت را دارند:
    1. **نویسنده خودِ کامنت** (کاربری که کامنت را ارسال کرده است).
    2. **مدیر سیستم (`ADMIN`)** (جهت مدیریت و نظارت کلی).
    3. **نویسنده پستی که کامنت روی آن ثبت شده است** (جهت مدیریت، پاک‌سازی و تعدیل کامنت‌های نامناسب در پست خود).
  - در صورتی که کاربر هیچ‌یک از این ۳ گروه نباشد، با خطای `403 Forbidden` مواجه می‌شود.
  - **حذف زنجیره‌ای (Cascade):** با حذف یک کامنت والد، طبق رابطه دیتابیس تمام پاسخ‌ها (Replies) ثبت شده زیر آن نیز به صورت خودکار حذف می‌شوند.

  ---

  ### 🔐 احراز هویت و دسترسی
  - **نوع توکن:** Bearer Token (`{{accessToken}}`)
  - **نقش‌های مجاز:** نویسنده کامنت، ادمین سیستم، یا نویسنده پست مربوطه

  ---

  ### 🌐 مشخصات درخواست
  - **متد:** `DELETE`
  - **آدرس:** `{{base_url}}/comments/:commentId`
  - **بدنه:** ندارد

  ---

  ### 📤 نمونه پاسخ موفق (`200 OK`)
  ```json
  {
    "success": true,
    "data": {
      "commentId": "c1111111-1111-1111-1111-111111111111",
      "message": "comment Delete successfully."
    }
  }
  ```

  ---

  ### ❌ خطاهای احتمالی
  | کد وضعیت | پیام / علت |
  |----------|------------|
  | `400 Bad Request` | فرمت `commentId` ارسال شده UUID معتبر نیست |
  | `401 Unauthorized` | کاربر لاگین نکرده یا توکن نامعتبر است |
  | `403 Forbidden` | کاربر اجازه حذف این کامنت را ندارد |
  | `404 Not Found` | کامنت با این شناسه یافت نشد |
